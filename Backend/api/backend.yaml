openapi: 3.1.0
info:
  title: Presentation generator
  version: 1.0.0
  description: AI agent tool that analyzes table of data and generates a presentation from it

# Endpoints
paths:

  /chats:
    get:
      tags:
        - Chat
      summary: List chat history after restart
      responses:
        '200':
          description: Chats history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Chat
      summary: Create a chat and start a slide generator
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StartQuery"
            encoding:
              table:
                contentType: text/csv
      responses:
        '202':
          description: Chat is created, generator is started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        '422':
          description: Incomplete data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/status/{taskID}:
    get:
      tags:
        - Chat
      summary: Check slide generation status
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
        - name: taskID
          in: path
          required: true
          description: Identifier of chat generation in queue
          schema:
            type: string
            example: "task_111"
      responses:
        '200':
          description: Current generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatStatus"
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}:
    get:
      tags:
        - Chat
      summary: Get page with slide drafts
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
      responses:
        '200':
          description: Page with slides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/slides/{slideID}/edits:
    post:
      tags:
        - Chat
      summary: Create a slide edit request
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
        - name: slideID
          in: path
          required: true
          description: Identifier of the slide to edit.
          schema:
            type: string
            example: "slide_777"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditQuery"
      responses:
        '202':
          description: Request accepted, edit started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        '404':
          description: Chat or slide not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '422':
          description: Invalid prompt or unknown versionID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/slides/{slideID}/status/{taskID}:
    get:
      tags:
        - Chat
      summary: Check slide editing status
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
        - name: slideID
          in: path
          required: true
          description: Identifier of the slide.
          schema:
            type: string
            example: "slide_777"
        - name: taskID
          in: path
          description: Identifier task of chat generation in database queue
          schema:
            type: string
            example: "task_111"
      responses:
        '200':
          description: Current slide editing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlideStatus"
        '404':
          description: Slide not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/slides/{slideID}:
    get:
      tags:
        - Chat
      summary: Get edited slide
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
        - name: slideID
          in: path
          required: true
          description: Identifier of the slide.
          schema:
            type: string
            example: "slide_777"
        - name: versionID
          in: query
          required: false
          description: Identifier of the version of the slide.
          schema:
            type: string
            example: "version_341"
      responses:
        '200':
          description: Edited slide
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SlideVersion"
                  - type: object
                    properties:
                      slideID:
                        type: string
                        example: "slide_777"
                        description: Identifier of the slide this version belongs to.
        '404':
          description: Slide not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/slides/{slideID}/versions:
    post:
      tags:
        - Chat
      summary: Create a new slide version from Drag-and-Drop changes
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
        - name: slideID
          in: path
          required: true
          description: Identifier of the slide.
          schema:
            type: string
            example: "slide_777"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlideVersion"
      responses:
        '202':
          description: Request accepted, version changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        '404':
          description: Chat or slide not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '422':
          description: Invalid slide version payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/downloads:
    post:
      tags:
        - Chat
      summary: Create a presentation export
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: List of slide states to include in the export.
              items:
                $ref: "#/components/schemas/SlideState"
      responses:
        '202':
          description: Export started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '422':
          description: Invalid or incomplete slides list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags:
        - Chat
      summary: Download presentation bundle (PPTX + JSON)
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
      responses:
        '200':
          description: ZIP archive with PPTX and JSON
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
                description: Binary contents of the ZIP archive.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="presentation.zip"
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '409':
          description: File is not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chats/{chatID}/downloads/status:
    get:
      tags:
        - Chat
      summary: Check export status
      parameters:
        - name: chatID
          in: path
          required: true
          description: Identifier of the chat.
          schema:
            type: string
            example: "chat_123"
      responses:
        '200':
          description: Current export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadStatus"
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:

  schemas:

    CsvFile:
      type: string
      contentMediaType: text/csv
      description: Source CSV file with tabular data used to generate the presentation.

    JsonDraftSlide:
      $ref: "./../JSON_schemas/presentation_draft.schema.json"

    SlideVersion:
      type: object
      description: A single version of a slide's content.
      properties:
        versionID:
          type: string
          description: Unique identifier of this slide version.
          example: "version_777"
        slide:
          allOf:
            - $ref: "#/components/schemas/JsonDraftSlide"
          description: Slide content as a structured draft object.
        createdAt:
          type: string
          format: date-time
          description: Date and time when this version was created.
          example: "2026-07-03T10:15:00Z"

    StartQuery:
      type: object
      description: Payload used to create a new chat and start slide generation. Sent from frontend to backend.
      required:
        - prompt
        - table
      properties:
        prompt:
          type: string
          description: User's instruction describing the desired presentation.
          example: "Build a 10-slide investor pitch deck from this sales data."
        table:
          $ref: "#/components/schemas/CsvFile"

    ChatSummary:
      type: object
      description: Chat history which is loading every application restart. Sent from backend to frontend.
      properties:
        chatID:
          type: string
          description: Unique identifier of the chat.
          example: "chat_123"
        title:
          type: string
          description: Human-readable title of the chat.
          example: "Q3 Sales Pitch Deck"
    
    Chat:
      type: object
      description: A chat session containing the generated slide drafts and their editing history. Sent from backend to frontend.
      properties:
        id:
          type: string
          description: Unique identifier of the chat.
          example: "chat_123"
        title:
          type: string
          description: Human-readable title of the chat.
          example: "Q3 Sales Pitch Deck"
        slides:
          type: array
          description: Ordered list of slides belonging to this chat.
          items:
            type: object
            properties:
              slideID:
                type: string
                description: Unique identifier of the slide.
                example: "slide_777"
              order:
                type: integer
                description: Position of the slide within the presentation, starting at 1.
                example: 1
              versions:
                type: array
                description: All versions ever created for this slide.
                items:
                  $ref: "#/components/schemas/SlideVersion"
              state:
                $ref: "#/components/schemas/SlideState"

    JobResponse:
      type: object
      description: Response returned when an asynchronous job (generation, edit, or version change) has been accepted.
      properties:
        chatID:
          type: string
          description: Identifier of the chat the job belongs to.
          example: "chat_123"
        taskID:
          type: 
            - string
            - "null"
          description: Identifier of the task in database for queue.
          example: "task_111"

    ChatStatus:
      type: object
      description: Status of the presentation generation job for a chat.
      properties:
        status:
          type: string
          enum: [pending, processing, done, failed]
          description: Current status of the generation job.
          example: "pending"
        error:
          type:
            - string
            - "null"
          description: Error message if the job failed, otherwise null.
          example: null

    EditQuery:
      type: object
      description: Payload used to request an edit of a slide version. Sent from frontend to backend.
      required:
        - prompt
        - versionID
      properties:
        prompt:
          type: string
          description: Instruction describing the desired change to the slide.
          example: "Make the headline shorter and add a bar chart of Q3 revenue."
        versionID:
          type: string
          description: Identifier of the slide version to base the edit on.
          example: "version_777"

    SlideState:
      type: object
      description: Describes which version of a slide is active and whether it is included in the final presentation.
      properties:
        slideID:
          type: string
          description: Identifier of the slide
          example: "slide_777"
        selectedVersionID:
          type: string
          description: Identifier of the version currently selected for this slide.
          example: "version_777"
        inPresentation:
          type: boolean
          description: Whether this slide is included in the exported presentation.
          example: true

    SlideStatus:
      type: object
      description: Status of an edit or version-change job for a single slide.
      properties:
        status:
          type: string
          enum: [idle, pending, processing, done, failed]
          description: Current status of the job. "idle" means no edit is currently in progress for this slide.
          example: "processing"
        newVersionID:
          type:
            - string
            - "null"
          description: Identifier of the newly created version if the job is done, otherwise null.
          example: "version_778"
        error:
          type:
            - string
            - "null"
          description: Error message if the job failed, otherwise null.
          example: null

    DownloadStatus:
      type: object
      description: Status of a presentation export job.
      properties:
        status:
          type: string
          enum: [pending, processing, done, failed]
          description: Current status of the export job.
          example: "pending"
        error:
          type:
            - string
            - "null"
          description: Error message if the export failed, otherwise null.
          example: null

    Error:
      type: object
      description: Standard error response.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message.
          example: ".csv file required"
        details:
          type: array
          description: Optional list of field-level validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Name of the field that failed validation.
                example: "table"
              message:
                type: string
                description: Description of why the field failed validation.
                example: "table is required and must be a valid CSV file"