<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Сбер Киви</title>
    <meta name="application name" content="Sber-Kiwi" />
    <meta name="author" content="Чиботарь Андрей" />
    <link rel="stylesheet" type="text/css" href="styles/layout.css" />
  </head>
  <body>
    <div id="chats">
      <input type="button" id="new-chat" value="+" />
      <input type="button" class="chat" value="Чат 1" />
      <input type="button" class="chat" value="Чат 2" />
      <input type="button" class="chat" value="Чат 3" />
    </div>
    <div id="start">
      <h1 id="greeting">Добрый день, Босс!</h1>
      <div id="edits">
        <textarea
          id="comment"
          name="comment"
          placeholder="Введите запрос и прикрепите таблицу с данными"
        ></textarea>
        <input
          type="image"
          src="images/paperclip.png"
          class="send"
          name="paperclip"
        />
        <input
          type="image"
          src="images/send.png"
          class="send"
          name="send-edit"
        />
      </div>
    </div>
  </body>
</html>
